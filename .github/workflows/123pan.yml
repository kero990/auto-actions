name: 123pan build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version override (e.g. 4.0.4). Leave empty to auto-resolve the latest upstream release."
        required: false
        default: ""

permissions: {}

env:
  PKG_NAME: com.github.123pan
  APP_ID: com.github.123pan
  APP_NAME: 123pan
  ICON_BASENAME: com.github.123pan

defaults:
  run:
    shell: bash

jobs:
  # --------------------------------------------------------------------------
  # Resolve the version to package: prefer the workflow override, otherwise
  # take the latest upstream release of 123panNextGen/123pan.
  # --------------------------------------------------------------------------
  resolve-version:
    name: Resolve upstream release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve version
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(curl -fsSL https://api.github.com/repos/123panNextGen/123pan/releases/latest | python3 -c 'import sys,json; sys.stdout.write(json.load(sys.stdin)["tag_name"].lstrip("v"))')"
          fi
          [ -n "$VERSION" ] || { echo "ERROR: could not resolve version" >&2; exit 1; }
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

  # --------------------------------------------------------------------------
  # UOS container debs (for UOS / Deepin V20, glibc 2.28, no Qt6).
  # Build AppDir with quick-sharun on archlinux, then copy the WHOLE AppDir
  # into /opt/apps/<APP_ID>/files. Deb name carries the _UOS suffix.
  # --------------------------------------------------------------------------
  container:
    name: UOS container deb (${{ matrix.label }})
    needs: resolve-version
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/pkgforge-dev/archlinux:latest
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            label: x64
            asset_arch: x64
            dearch: amd64
          - runner: ubuntu-22.04-arm
            label: arm64
            asset_arch: arm64
            dearch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Anylinux tools
        uses: pkgforge-dev/anylinux-setup-action@0964f2258d6c93d1391359978dde081fd8b3c6af

      - name: Install debloated libs
        run: |
          get-debloated-pkgs --add-common --prefer-nano

      - name: Download upstream release and stage AppDir/bin
        env:
          VERSION: ${{ env.VERSION }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: |
          set -euo pipefail
          URL="https://github.com/123panNextGen/123pan/releases/download/v${VERSION}/123pan-linux-${ASSET_ARCH}.zip"
          echo "Downloading $URL"
          curl -fL --retry 3 -o /tmp/123pan.zip "$URL"
          ls -lh /tmp/123pan.zip

          rm -rf AppDir
          mkdir -p AppDir/bin
          rm -rf /tmp/123pan_unzip
          mkdir -p /tmp/123pan_unzip
          unzip -q /tmp/123pan.zip -d /tmp/123pan_unzip
          echo "== zip content =="
          ls -R /tmp/123pan_unzip | head -50 || true

          # 解包所有文件到 AppDir/bin（兼容 zip 内单层目录或扁平文件两种情况）
          if [ "$(find /tmp/123pan_unzip -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ] && [ -d "$(find /tmp/123pan_unzip -mindepth 1 -maxdepth 1)" ]; then
            INNER=$(find /tmp/123pan_unzip -mindepth 1 -maxdepth 1)
            cp -a "$INNER"/. AppDir/bin/
          else
            cp -a /tmp/123pan_unzip/. AppDir/bin/
          fi

          echo "== AppDir/bin content =="
          ls -lh AppDir/bin
          # 确保主二进制存在且可执行
          if [ ! -f AppDir/bin/123pan ]; then
            FOUND=$(find AppDir/bin -maxdepth 2 -type f -name '123pan*' | head -1 || true)
            if [ -n "$FOUND" ] && [ "$FOUND" != "AppDir/bin/123pan" ]; then
              echo "Moving $FOUND -> AppDir/bin/123pan"
              mv "$FOUND" AppDir/bin/123pan
            fi
          fi
          chmod +x AppDir/bin/123pan
          ls -lh AppDir/bin/123pan
          file AppDir/bin/123pan || true

      - name: Bundle with quick-sharun
        env:
          DESKTOP: ${{ github.workspace }}/assets/123pan/123pan.desktop
          ICON: ${{ github.workspace }}/assets/123pan/123pan.png
          DEPLOY_QT: 1
        run: |
          set -euo pipefail
          echo "DESKTOP=$DESKTOP"
          echo "ICON=$ICON"
          echo "DEPLOY_QT=$DEPLOY_QT"
          ls -lh "$DESKTOP" "$ICON"
          cat "$DESKTOP"
          which quick-sharun
          quick-sharun AppDir/bin/123pan
          echo "== AppDir after quick-sharun =="
          ls -la AppDir
          ls -lh AppDir/bin | head -30 || true

      - name: Build UOS container deb from AppDir
        env:
          VERSION: ${{ env.VERSION }}
          DEB_ARCH: ${{ matrix.dearch }}
        run: |
          set -euo pipefail
          WORK="${GITHUB_WORKSPACE:-$PWD}"
          [ -n "$VERSION" ] || { echo "VERSION is empty" >&2; exit 1; }
          echo "Packaging UOS version $VERSION for $DEB_ARCH"

          # arch 容器内可能缺少 dpkg-deb，先安装
          if ! command -v dpkg-deb >/dev/null 2>&1; then
            pacman -Syu --noconfirm dpkg
          fi

          PKG_ROOT="$WORK/pkg"
          OUT_DIR="$WORK/out"
          APPID_DIR="$PKG_ROOT/opt/apps/${APP_ID}"
          rm -rf "$PKG_ROOT" "$OUT_DIR"
          mkdir -p "$OUT_DIR" \
                   "$APPID_DIR/files" \
                   "$APPID_DIR/entries/applications" \
                   "$APPID_DIR/entries/icons/hicolor/256x256/apps" \
                   "$PKG_ROOT/DEBIAN"

          # 1) whole AppDir content -> /opt/apps/<APP_ID>/files
          cp -a "$WORK/AppDir/." "$APPID_DIR/files/"
          # quick-sharun 会把 desktop/icon 放在 AppDir 顶层，files 下不需要重复存放它们
          rm -f "$APPID_DIR/files"/*.desktop || true

          # 2) 寻找启动器：优先 AppRun，其次 sharun，最后 bin/123pan
          LAUNCHER=""
          if [ -x "$APPID_DIR/files/AppRun" ]; then
            LAUNCHER="/opt/apps/${APP_ID}/files/AppRun"
          elif [ -x "$APPID_DIR/files/sharun" ]; then
            LAUNCHER="/opt/apps/${APP_ID}/files/sharun"
          elif [ -x "$APPID_DIR/files/bin/123pan" ]; then
            LAUNCHER="/opt/apps/${APP_ID}/files/bin/123pan"
          else
            echo "ERROR: no launcher found in AppDir" >&2
            ls -R "$APPID_DIR/files" | head -50 || true
            exit 1
          fi
          echo "Launcher: $LAUNCHER"
          chmod +x "$APPID_DIR/files/AppRun" 2>/dev/null || true
          chmod +x "$APPID_DIR/files/sharun" 2>/dev/null || true
          chmod +x "$APPID_DIR/files/bin/123pan" 2>/dev/null || true

          # 3) deepin/UOS info (full permission set, UOS spec)
          cat > "$APPID_DIR/info" <<EOF
          {
              "appid": "${APP_ID}",
              "name": "123pan",
              "version": "${VERSION}",
              "arch": ["${DEB_ARCH}"],
              "permissions": {
                  "autostart": false,
                  "notification": true,
                  "trayicon": true,
                  "clipboard": true,
                  "account": false,
                  "bluetooth": false,
                  "camera": false,
                  "audio_record": false,
                  "installed_apps": false
              }
          }
          EOF

          # 4) deb control (container bundles its own runtime -> no Depends)
          cat > "$PKG_ROOT/DEBIAN/control" <<EOF
          Package: ${PKG_NAME}
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: ${DEB_ARCH}
          Maintainer: 123pan build <noreply@localhost>
          Description: 第三方 123 云盘客户端 (UOS container repackage)
           第三方 123 云盘客户端，基于 PySide6，使用 quick-sharun 打包，
           自带 Qt/依赖运行时，适用于低 glibc 的 UOS/DeepinV20 系统。
          EOF

          # 5) desktop 资源：以仓库 assets 为底本，Exec 重写为 files 内启动器绝对路径
          #    （上游/自带 desktop 的 Exec 只是 "123pan"，必须修正，否则 deepin 启动器找不到程序）
          sed -E "s#^Exec=.*#Exec=${LAUNCHER} %F#" "$WORK/assets/123pan/123pan.desktop" \
            | sed -E "s#^Icon=.*#Icon=${APP_ID}#" \
            > "$APPID_DIR/entries/applications/${APP_ID}.desktop"
          cat "$APPID_DIR/entries/applications/${APP_ID}.desktop"

          # 6) icon 资源固定为 256x256
          cp "$WORK/assets/123pan/123pan.png" "$APPID_DIR/entries/icons/hicolor/256x256/apps/${APP_ID}.png"

          find "$PKG_ROOT" -type d -exec chmod 755 {} \;
          chmod 644 "$PKG_ROOT/DEBIAN/control" "$APPID_DIR/info" \
            "$APPID_DIR/entries/applications/${APP_ID}.desktop" \
            "$APPID_DIR/entries/icons/hicolor/256x256/apps/${APP_ID}.png"

          echo "== Packaging deb (xz, _UOS) =="
          dpkg-deb --root-owner-group -Zxz -b "$PKG_ROOT" "$OUT_DIR/${PKG_NAME}_${VERSION}_${DEB_ARCH}_UOS.deb"
          dpkg-deb -I "$OUT_DIR/${PKG_NAME}_${VERSION}_${DEB_ARCH}_UOS.deb" | sed -n '1,14p'
          ls -lh "$OUT_DIR/"

      - name: Upload container deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.github.123pan-uos-${{ env.VERSION }}-${{ matrix.label }}
          path: out/*.deb
          if-no-files-found: error

      - name: Upload to Tmplink
        run: |
          DEB_FILE=$(ls out/*.deb | head -1)
          curl -k -F "file=@${DEB_FILE}" \
           -F "token=${{ secrets.TMPLINK_TOKEN }}" \
           -F "model=0" \
           -F "mr-id=0" \
           -X POST "https://tmp-cli.vx-cdn.com/app/upload_cli"

  # --------------------------------------------------------------------------
  # Standard debs (for Deepin V23/V25): repackage the upstream release zip
  # directly into the deepin /opt/apps layout (no container runtime).
  # --------------------------------------------------------------------------
  standard:
    name: standard deb (${{ matrix.label }})
    needs: resolve-version
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            label: x64
            asset_arch: x64
            dearch: amd64
          - runner: ubuntu-22.04-arm
            label: arm64
            asset_arch: arm64
            dearch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y curl file unzip xz-utils python3-pil

      - name: Build standard deepin deb
        env:
          VERSION: ${{ env.VERSION }}
          DEB_ARCH: ${{ matrix.dearch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: |
          set -euo pipefail
          WORK="${GITHUB_WORKSPACE:-$PWD}"
          PKG_ROOT="$WORK/pkg"
          OUT_DIR="$WORK/out"
          mkdir -p "$OUT_DIR"
          [ -n "$VERSION" ] || { echo "VERSION is empty" >&2; exit 1; }

          echo "== Downloading upstream release zip (v${VERSION}, linux-${ASSET_ARCH}) =="
          curl -fL --retry 3 -o "$WORK/upstream.zip" \
            "https://github.com/123panNextGen/123pan/releases/download/v${VERSION}/123pan-linux-${ASSET_ARCH}.zip"
          ls -lh "$WORK/upstream.zip"

          rm -rf "$WORK/upstream_unzip"
          mkdir -p "$WORK/upstream_unzip"
          unzip -q "$WORK/upstream.zip" -d "$WORK/upstream_unzip"
          echo "== upstream zip content =="
          ls -R "$WORK/upstream_unzip" | head -50 || true

          echo "== Assembling deepin package tree =="
          APPID_DIR="$PKG_ROOT/opt/apps/${APP_ID}"
          rm -rf "$PKG_ROOT"
          mkdir -p "$APPID_DIR/files" \
                   "$APPID_DIR/entries/applications" \
                   "$APPID_DIR/entries/icons/hicolor/256x256/apps" \
                   "$PKG_ROOT/DEBIAN"

          # 1) 上游 zip 全部内容 -> /opt/apps/<APP_ID>/files
          #    （兼容 zip 内单层目录或扁平文件两种情况）
          if [ "$(find "$WORK/upstream_unzip" -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ] \
            && [ -d "$(find "$WORK/upstream_unzip" -mindepth 1 -maxdepth 1)" ]; then
            INNER=$(find "$WORK/upstream_unzip" -mindepth 1 -maxdepth 1)
            cp -a "$INNER"/. "$APPID_DIR/files/"
          else
            cp -a "$WORK/upstream_unzip"/. "$APPID_DIR/files/"
          fi

          # 2) 定位实际主程序（zip 内路径与 desktop 不一致时以实际文件为准）
          BIN=""
          if [ -x "$APPID_DIR/files/123pan" ]; then
            BIN="/opt/apps/${APP_ID}/files/123pan"
          elif [ -x "$APPID_DIR/files/bin/123pan" ]; then
            BIN="/opt/apps/${APP_ID}/files/bin/123pan"
          else
            FOUND=$(find "$APPID_DIR/files" -maxdepth 3 -type f -name '123pan' | head -1 || true)
            if [ -n "$FOUND" ]; then
              chmod +x "$FOUND"
              BIN="/opt/apps/${APP_ID}${FOUND#"$APPID_DIR/files"}"
            else
              echo "ERROR: 123pan binary not found" >&2
              ls -R "$APPID_DIR/files" | head -50 || true
              exit 1
            fi
          fi
          chmod +x "$APPID_DIR/files/123pan" 2>/dev/null || true
          chmod +x "$APPID_DIR/files/bin/123pan" 2>/dev/null || true
          echo "Binary: $BIN"

          cat > "$APPID_DIR/info" <<EOF
          {
              "appid": "${APP_ID}",
              "name": "123pan",
              "version": "${VERSION}",
              "arch": ["${DEB_ARCH}"],
              "permissions": {
                  "autostart": false,
                  "notification": true,
                  "trayicon": true,
                  "clipboard": true,
                  "account": false,
                  "bluetooth": false,
                  "camera": false,
                  "audio_record": false,
                  "installed_apps": false
              }
          }
          EOF

          # 标准包直接运行上游二进制，不自带运行时 -> 无额外 Depends
          {
            echo "Package: ${PKG_NAME}"
            echo "Version: ${VERSION}"
            echo "Section: net"
            echo "Priority: optional"
            echo "Architecture: ${DEB_ARCH}"
            echo "Maintainer: 123pan build <noreply@localhost>"
            echo "Description: 第三方 123 云盘客户端 (deepin repackage)"
            echo " 第三方 123 云盘客户端，上游 release 直装重排为 deepin /opt/apps"
            echo " 布局，适用于 Deepin V23/V25 系统。"
          } > "$PKG_ROOT/DEBIAN/control"

          # 3) desktop：以仓库 assets 为底本，Exec 重写为实际二进制绝对路径
          #    （自带 desktop 的 Exec 只是 "123pan"，必须修正）
          sed -E "s#^Exec=.*#Exec=${BIN} %F#" "$WORK/assets/123pan/123pan.desktop" \
            | sed -E "s#^Icon=.*#Icon=${APP_ID}#" \
            > "$APPID_DIR/entries/applications/${APP_ID}.desktop"
          cat "$APPID_DIR/entries/applications/${APP_ID}.desktop"

          # 4) icon 固定为 256x256
          cp "$WORK/assets/123pan/123pan.png" "$APPID_DIR/entries/icons/hicolor/256x256/apps/${APP_ID}.png"

          find "$PKG_ROOT" -type d -exec chmod 755 {} \;
          chmod 644 "$PKG_ROOT/DEBIAN/control" "$APPID_DIR/info" \
            "$APPID_DIR/entries/applications/${APP_ID}.desktop" \
            "$APPID_DIR/entries/icons/hicolor/256x256/apps/${APP_ID}.png"

          echo "== Packaging deb (xz) =="
          dpkg-deb --root-owner-group -Zxz -b "$PKG_ROOT" "$OUT_DIR/${PKG_NAME}_${VERSION}_${DEB_ARCH}.deb"
          dpkg-deb -I "$OUT_DIR/${PKG_NAME}_${VERSION}_${DEB_ARCH}.deb" | sed -n '1,14p'
          ls -lh "$OUT_DIR/"

      - name: Upload standard deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.github.123pan-std-${{ env.VERSION }}-${{ matrix.label }}
          path: out/*.deb
          if-no-files-found: error

      - name: Upload to Tmplink
        run: |
          DEB_FILE=$(ls out/*.deb | head -1)
          curl -k -F "file=@${DEB_FILE}" \
           -F "token=${{ secrets.TMPLINK_TOKEN }}" \
           -F "model=0" \
           -F "mr-id=0" \
           -X POST "https://tmp-cli.vx-cdn.com/app/upload_cli"
